<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#272729">
    <title>オフライン | ツクリスト</title>
    <style>
        /* DESIGN.md準拠: 単色アクセント(#0066cc)・グラデーションなし・影はフローティング面のみ */
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background: #272729;
            color: #1d1d1f;
            font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui,
                "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
            line-height: 1.47;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: min(100%, 480px);
            padding: 40px;
            border-radius: 18px;
            background: #fff;
            box-shadow: rgba(0, 0, 0, 0.22) 3px 5px 30px 0;
        }

        .brand {
            margin-bottom: 12px;
            color: #6e6e73;
            font-size: 12px;
            font-weight: 600;
        }

        .code {
            margin-bottom: 20px;
            color: #0066cc;
            font-size: 48px;
            font-weight: 600;
            line-height: 1;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 21px;
            font-weight: 600;
            line-height: 1.4;
            letter-spacing: -0.01em;
        }

        p {
            margin: 0 0 28px;
            color: #6e6e73;
            font-size: 14px;
            line-height: 1.8;
        }

        button {
            min-height: 44px;
            padding: 10px 22px;
            border: 0;
            border-radius: 9999px;
            background: #0066cc;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 400;
            cursor: pointer;
            transition: transform 150ms cubic-bezier(0.28, 0, 0.22, 1), background 150ms;
        }

        button:hover {
            background: #0071e3;
        }

        button:active {
            transform: scale(0.95);
        }

        button:focus-visible {
            outline: 2px solid #0071e3;
            outline-offset: 2px;
        }

        @media (max-width: 480px) {
            main {
                padding: 28px;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="brand">ツクリスト / OFFLINE</div>
        <div class="code" aria-hidden="true">OFFLINE</div>
        <h1>インターネットに接続できません</h1>
        <p>接続を確認してから、もう一度お試しください。オフライン中はタスクの読み込みや変更の保存はできません。</p>
        <button type="button" onclick="location.reload()">再読み込み</button>
    </main>
</body>

</html>
